name: box-find-dev

services:
  mongodb:
    image: mongo:7.0
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  mongodb-data:
